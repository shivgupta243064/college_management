<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - CampusEvents</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
      <ul class="sidebar-nav">
        <li><a href="dashboard.html" class="nav-item"><span class="icon">🏠</span> Back to Dashboard</a></li>
        <li><a href="#" class="nav-item active" id="tab-manage"><span class="icon">⚙️</span> Manage Events</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="d-flex justify-between align-center mb-4">
        <h2>Admin Panel</h2>
        <button class="btn btn-primary" onclick="openEventModal()">+ Add New Event</button>
      </div>

      <div class="table-container">
        <table id="admin-events-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Date</th>
              <th>Category</th>
              <th>Capacity</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- Loaded dynamically -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Event Modal -->
  <div class="modal-overlay" id="event-modal-overlay">
    <div class="modal">
      <button class="modal-close" onclick="closeEventModal()">×</button>
      <h3 id="modal-title" class="mb-3">Add Event</h3>
      <form id="event-form">
        <input type="hidden" id="event-id">
        <div class="form-group">
          <label>Event Name</label>
          <input type="text" id="event_name" class="form-control" required>
        </div>
        <div class="d-flex gap-2">
          <div class="form-group" style="flex: 1;">
            <label>Date</label>
            <input type="date" id="event_date" class="form-control" required>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Time</label>
            <input type="time" id="event_time" class="form-control" required>
          </div>
        </div>
        <div class="form-group">
          <label>Venue</label>
          <input type="text" id="venue" class="form-control" required>
        </div>
        <div class="d-flex gap-2">
          <div class="form-group" style="flex: 1;">
            <label>Category</label>
            <select id="category" class="form-control" required>
              <option value="Technical">Technical</option>
              <option value="Cultural">Cultural</option>
              <option value="Sports">Sports</option>
              <option value="Workshop">Workshop</option>
              <option value="Seminar">Seminar</option>
            </select>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Max Capacity</label>
            <input type="number" id="max_capacity" class="form-control" required min="1">
          </div>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="description" class="form-control" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-100" style="width:100%">Save Event</button>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
