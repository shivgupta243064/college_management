<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - CampusEvents</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="dashboard-layout">
    <aside class="sidebar">
      <ul class="sidebar-nav">
        <li><a href="dashboard.html" class="nav-item"><span class="icon">🏠</span> Dashboard</a></li>
        <li><a href="profile.html" class="nav-item active"><span class="icon">👤</span> Profile</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="mb-4">
        <h2>My Profile</h2>
        <p class="text-secondary">Manage your account settings.</p>
      </div>

      <div class="glass-card" style="max-width: 600px;">
        <div class="text-center">
          <div id="profile-avatar" class="avatar avatar-lg">U</div>
          <h3 id="profile-username" class="mb-1">username</h3>
          <p id="profile-role" class="text-secondary mb-3 badge badge-default">Role</p>
        </div>

        <form id="profile-form">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="prof-fullname" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="prof-email" class="form-control" required>
          </div>
          <div class="form-group">
            <label>New Password (Optional)</label>
            <input type="password" id="prof-password" class="form-control" placeholder="Leave blank to keep current">
          </div>
          <button type="submit" class="btn btn-primary w-100" style="width: 100%;">Update Profile</button>
        </form>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
