<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - CampusEvents</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="auth-page">
    <div class="glass-card auth-container" style="max-width: 500px;">
      <div class="auth-header">
        <h2>Create an Account</h2>
        <p class="text-secondary">Join to discover and register for events</p>
      </div>
      <form id="register-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="fullname" class="form-control" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
        </div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" class="form-control" placeholder="johndoe" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="form-control" placeholder="Create a password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100" style="width: 100%; margin-top: 1rem;">Register</button>
      </form>
      <div class="text-center mt-3">
        <p class="text-secondary">Already have an account? <a href="login.html">Login here</a></p>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
