<!DOCTYPE html>
<html>
<head>
<title>Register</title>

<style>
body{
    font-family: Arial;
    background-color: #f2f2f2;
}

.container{
    width: 350px;
    margin: 80px auto;
    background: white;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
}

input{
    width: 90%;
    padding: 10px;
    margin: 8px;
}

button{
    width: 95%;
    padding: 10px;
    background: blue;
    color: white;
    border: none;
    border-radius: 5px;
}
</style>

</head>

<body>

<div class="container">

<h1>Register</h1>

<form method="POST">

<input type="text" name="fullname" placeholder="Full Name"><br>

<input type="email" name="email" placeholder="Email"><br>

<input type="text" name="username" placeholder="Username"><br>

<input type="password" name="password" placeholder="Password"><br>

<button type="submit">Register</button>

</form>

</div>

</body>
</html>
